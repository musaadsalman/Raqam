<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصفحة غير موجودة | رقم</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#60E2FC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0E13;--mute:#5B6670;--cyan:#60E2FC;--yellow:#FDFF04;--coral:#FF6279;--line:#DCE3E6;
  --display:"Rubik","Segoe UI",Tahoma,sans-serif;--body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:var(--ink);font-family:var(--body);line-height:1.85}
a{color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:6px}
header{background:var(--cyan);padding:18px clamp(18px,4vw,56px) 70px}
.bar{display:flex;justify-content:space-between;align-items:center}
.bar svg{width:78px;height:auto}
.back{font-family:var(--display);font-weight:700;font-size:15px;background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;text-decoration:none}
h1{font-family:var(--display);font-weight:900;font-size:clamp(36px,5vw,60px);line-height:1.3;margin-top:40px}
h1 span{background:linear-gradient(transparent 58%,var(--yellow) 58%);padding:0 .1em}
.updated{color:rgba(10,14,19,.7);margin-top:6px}
main{max-width:760px;margin:-40px auto 0;background:#fff;border:3px solid var(--ink);border-radius:28px;box-shadow:10px 10px 0 var(--ink);padding:clamp(22px,4vw,48px);position:relative}
@media (max-width:820px){main{margin:-40px 16px 0}}
h2{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.4;margin:30px 0 8px;display:flex;align-items:center;gap:10px}
h2:first-child{margin-top:0}
h2::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--coral);flex-shrink:0}
p,li{font-size:16.5px;max-width:65ch}
ul{padding-inline-start:22px;margin-top:6px}
li{margin-bottom:6px}
footer{text-align:center;color:var(--mute);font-size:14px;padding:50px 16px 40px}
.num{font-family:var(--display);direction:ltr;unicode-bidi:isolate}
.nf{min-height:100vh;background:var(--cyan);display:grid;place-items:center;text-align:center;padding:40px 18px}
.big{font-family:var(--display);font-weight:900;font-size:clamp(120px,26vw,260px);line-height:1.1;direction:ltr}
.big b{background:var(--yellow);border:4px solid var(--ink);border-radius:24px;padding:0 .12em;box-shadow:8px 8px 0 var(--ink);display:inline-block;transform:rotate(-4deg)}
.nf p{font-size:20px;margin:22px auto 28px;max-width:30ch}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="logo" viewBox="22 20 260 165">
      <g transform="translate(22,0)"><rect x="20" y="80" width="44" height="40" rx="14" fill="none" stroke="#0A0E13" stroke-width="20"/><rect x="10" y="100" width="20" height="78" rx="6" fill="#0A0E13"/></g>
      <g fill="#0A0E13"><rect x="136" y="62" width="20" height="90" rx="6"/><rect x="184" y="62" width="20" height="90" rx="6"/><rect x="110" y="62" width="120" height="20" rx="6"/><rect x="110" y="110" width="120" height="20" rx="6"/><rect x="82" y="110" width="38" height="20"/></g>
      <rect x="156" y="82" width="28" height="28" fill="#FF6279"/>
      <rect x="135" y="30" width="22" height="22" rx="6" fill="#0A0E13"/><rect x="183" y="30" width="22" height="22" rx="6" fill="#0A0E13"/>
      <path d="M262 92 V120 Q262 166 218 170" fill="none" stroke="#0A0E13" stroke-width="20" stroke-linecap="round"/>
    </symbol></defs></svg>
<div class="nf"><div>
  <div class="big">4<b>0</b>4</div>
  <p>هذا الرقم ما لقيناه. يمكن الرابط تغيّر أو انكتب غلط.</p>
  <a class="back" href="/">ارجع للرئيسية</a>
</div></div>
</body>
</html>
